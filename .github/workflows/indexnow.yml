name: IndexNow

on:
  push:
    branches: [main]
    paths:
      - '**.html'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Collect changed URLs
        id: urls
        run: |
          BASE_URL="https://fudosan-tools.com"

          # 手動実行時は全URLを送信
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            FILES=$(find . -name "*.html" -not -path "./.git/*" | sed 's|^\./||')
          else
            FILES=$(git diff --name-only HEAD~1 HEAD -- '*.html')
          fi

          URLS=$(echo "$FILES" | while read file; do
            [[ -z "$file" ]] && continue
            if [[ "$file" == "index.html" ]]; then
              echo "${BASE_URL}/"
            elif [[ "$file" == */index.html ]]; then
              dir=$(dirname "$file")
              echo "${BASE_URL}/${dir}/"
            else
              echo "${BASE_URL}/${file}"
            fi
          done | sort -u | jq -Rc . | jq -sc .)

          echo "urls=$URLS" >> $GITHUB_OUTPUT
          echo "Changed URLs: $URLS"

      - name: Submit to IndexNow
        if: steps.urls.outputs.urls != '[]' && steps.urls.outputs.urls != ''
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "fudosan-tools.com",
              "key": "${{ secrets.INDEXNOW_KEY }}",
              "keyLocation": "https://fudosan-tools.com/${{ secrets.INDEXNOW_KEY }}.txt",
              "urlList": ${{ steps.urls.outputs.urls }}
            }')
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")
          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $BODY"
          if [[ "$HTTP_STATUS" == "200" || "$HTTP_STATUS" == "202" ]]; then
            echo "✅ IndexNow submission successful"
          else
            echo "❌ IndexNow submission failed"
            exit 1
          fi
